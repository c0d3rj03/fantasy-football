<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premier Battle Royale (PBR)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950 px-4 md:px-6 py-3.5 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="text-xl md:text-2xl font-black tracking-wider text-amber-500">PBR</span>
      <h1 class="text-sm md:text-lg font-bold text-slate-200">PREMIER BATTLE ROYALE</h1>
    </div>
    <div class="flex items-center space-x-2">
      <label for="quarter-select" class="text-xs md:text-sm font-medium text-slate-400">Phase:</label>
      <select id="quarter-select" onchange="changeQuarter(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs md:text-sm rounded-lg px-2.5 py-1 focus:ring-2 focus:ring-amber-500 outline-none">
        <option value="1">Q1 (W1-W4)</option>
        <option value="2">Q2 (W5-W8)</option>
        <option value="3">Q3 (W9-W12)</option>
        <option value="postseason">Postseason (W13-W17)</option>
      </select>
    </div>
  </header>

  <!-- Main Container -->
  <div id="app-container" class="max-w-7xl mx-auto p-3 md:p-4 grid grid-cols-12 gap-3 md:gap-4">
    <!-- Left Navigation: Week Selector (Col 1) -->
    <aside id="left-nav" class="col-span-12 md:col-span-1">
      <div id="quarter-label" class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1.5 text-center">
        Q1
      </div>
      <div id="weeks-list" class="flex md:flex-col gap-1.5">
        <!-- Injected dynamically -->
      </div>
    </aside>

    <!-- Regular Season Grid (Cols 2-12) -->
    <div id="regular-season-view" class="col-span-12 md:col-span-11 grid grid-cols-11 gap-3 md:gap-4">
      <!-- Center Content: Matchups & Battle Royale (Cols 1-6) -->
      <main class="col-span-11 md:col-span-6 space-y-3 md:space-y-4">
        <div class="bg-slate-800/50 border border-slate-800 rounded-xl p-3.5">
          <h2 id="matchup-header" class="text-xs md:text-sm font-bold tracking-wider text-amber-400 uppercase mb-2.5">Head-to-Head Matchups</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5" id="matchups-grid"></div>
        </div>

        <div class="bg-slate-800/50 border border-slate-800 rounded-xl p-3.5">
          <h2 class="text-xs md:text-sm font-bold tracking-wider text-amber-400 uppercase mb-2.5">In-Division Battle Royale</h2>
          <div id="battle-royale-grid" class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 text-xs"></div>
        </div>
      </main>

      <!-- Right Sidebar: Standings View (Cols 7-11) -->
      <aside class="col-span-11 md:col-span-5 space-y-3 md:space-y-4">
        <div class="bg-slate-800/50 border border-slate-800 rounded-xl p-3.5">
          <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
            <div class="flex items-center space-x-1.5">
              <span class="text-xs md:text-sm font-bold tracking-wider text-amber-400 uppercase">Standings</span>
              <span class="text-xs text-slate-400 font-semibold">(</span>
              <button id="btn-current" onclick="setStandingsMode('current')" class="text-xs font-bold transition-all">Current</button>
              <span class="text-xs text-slate-500">/</span>
              <button id="btn-season" onclick="setStandingsMode('season')" class="text-xs font-bold transition-all">Season</button>
              <span class="text-xs text-slate-400 font-semibold">)</span>
            </div>
            <span id="standings-subhead" class="text-[10px] text-slate-400 font-mono">Thru W1</span>
          </div>

          <div id="standings-snapshot" class="space-y-3 text-xs"></div>

          <div class="flex items-center justify-between text-[10px] text-slate-400 border-t border-slate-800 pt-2.5 mt-2.5 px-1">
            <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-white mr-1.5"></span> Projected Promotion</span>
            <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-rose-400 mr-1.5"></span> Projected Relegation</span>
          </div>
        </div>
      </aside>
    </div>

    <!-- Postseason Matrix Dashboard View (Cols 2-12) -->
    <div id="postseason-view" class="col-span-12 md:col-span-11 space-y-4 hidden">
      <div class="bg-slate-800/50 border border-slate-800 rounded-xl p-3.5 md:p-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2.5 mb-3.5">
          <div>
            <h2 class="text-sm md:text-base font-bold text-amber-400 uppercase tracking-wider">Postseason Guillotine Tournament (W13–W17)</h2>
            <p class="text-xs text-slate-400">Head Start Bonus + Weekly Scores • Top = Weekly PF, Bottom = Cumulative Total</p>
          </div>
          <span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 font-mono text-xs px-2.5 py-1 rounded-lg shrink-0 ml-2">2026 Postseason</span>
        </div>

        <div id="postseason-matrix-container" class="space-y-4"></div>
      </div>
    </div>
  </div>

  <script>
    let leagueData = null;
    let currentQuarter = "1";
    let currentWeek = "1";
    let standingsMode = "current";

    const quarterWeeksMap = {
      "1": ["1", "2", "3", "4"],
      "2": ["5", "6", "7", "8"],
      "3": ["9", "10", "11", "12"]
    };

    async function loadData() {
      try {
        const res = await fetch('data.json');
        leagueData = await res.json();
        renderWeeksNav();
        renderWeekData(currentWeek);
      } catch (e) {
        console.error("Error loading data.json:", e);
      }
    }

    function changeQuarter(q) {
      currentQuarter = q.toString();
      if (currentQuarter === 'postseason') {
        renderPostseasonView();
      } else {
        const weeksInQ = quarterWeeksMap[currentQuarter] || ["1"];
        currentWeek = weeksInQ[0];
        renderWeeksNav();
        renderWeekData(currentWeek);
      }
    }

    function setStandingsMode(mode) {
      standingsMode = mode;
      updateToggleUI();
      renderWeekData(currentWeek);
    }

    function updateToggleUI() {
      const btnCurrent = document.getElementById('btn-current');
      const btnSeason = document.getElementById('btn-season');

      if (standingsMode === 'current') {
        btnCurrent.className = "text-xs font-bold text-amber-400 underline underline-offset-4";
        btnSeason.className = "text-xs font-medium text-slate-400 hover:text-slate-200";
      } else {
        btnCurrent.className = "text-xs font-medium text-slate-400 hover:text-slate-200";
        btnSeason.className = "text-xs font-bold text-amber-400 underline underline-offset-4";
      }
    }

    function renderWeeksNav() {
      document.getElementById('quarter-label').innerText = currentQuarter === 'postseason' ? 'Playoffs' : `Q${currentQuarter}`;
      document.getElementById('quarter-select').value = currentQuarter;

      const container = document.getElementById('weeks-list');
      const weeks = quarterWeeksMap[currentQuarter] || ["1", "2", "3", "4"];

      container.innerHTML = weeks.map(w => {
        const active = w.toString() === currentWeek;
        const cls = active ? "bg-amber-500 text-slate-950 font-bold" : "bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold";
        return `<button onclick="selectWeek('${w}')" class="flex-1 md:w-full ${cls} py-1.5 px-2 rounded-lg text-center text-xs shadow transition-colors">W${w}</button>`;
      }).join('');
    }

    function selectWeek(w) {
      currentWeek = w.toString();
      renderWeeksNav();
      renderWeekData(currentWeek);
    }

    function renderWeekData(w) {
      document.getElementById('regular-season-view').classList.remove('hidden');
      document.getElementById('postseason-view').classList.add('hidden');

      const weekObj = leagueData.weekly_data?.[w];
      const isPlayed = weekObj?.played ?? false;

      document.getElementById('matchup-header').innerText = isPlayed 
        ? `Week ${w} (Quarter ${weekObj.quarter}): Matchups` 
        : `Week ${w}: Scheduled Matchups (Unplayed)`;
      document.getElementById('standings-subhead').innerText = `Thru Week ${w}`;
      updateToggleUI();

      // Matchups Grid
      const mGrid = document.getElementById('matchups-grid');
      if (weekObj?.matchups && weekObj.matchups.length > 0) {
        mGrid.innerHTML = weekObj.matchups.map(m => `
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs space-y-1">
            <div class="flex justify-between items-center font-semibold py-0.5">
              <span class="${m.team1.vp_earned ? 'text-amber-400' : 'text-slate-200'} truncate mr-2">${m.team1.name}</span>
              <div class="flex items-center justify-end space-x-1.5 shrink-0">
                ${m.team1.vp_earned ? '<span class="text-[9px] bg-amber-500/20 text-amber-300 px-1 py-0.5 rounded font-bold">1 VP</span>' : ''}
                <span class="text-slate-200 font-bold font-mono text-right w-12">${isPlayed ? m.team1.score.toFixed(2) : '-'}</span>
              </div>
            </div>
            <div class="flex justify-between items-center font-semibold border-t border-slate-800/60 pt-1 py-0.5">
              <span class="${m.team2.vp_earned ? 'text-amber-400' : 'text-slate-200'} truncate mr-2">${m.team2.name}</span>
              <div class="flex items-center justify-end space-x-1.5 shrink-0">
                ${m.team2.vp_earned ? '<span class="text-[9px] bg-amber-500/20 text-amber-300 px-1 py-0.5 rounded font-bold">1 VP</span>' : ''}
                <span class="text-slate-200 font-bold font-mono text-right w-12">${isPlayed ? m.team2.score.toFixed(2) : '-'}</span>
              </div>
            </div>
          </div>
        `).join('');
      } else {
        mGrid.innerHTML = `
          <div class="col-span-1 sm:col-span-2 text-center text-slate-400 py-8 font-mono text-xs bg-slate-900 border border-slate-800 rounded-lg">
            🏈 Week ${w} matchups will be generated prior to kickoff.
          </div>`;
      }

      // Battle Royale Grid
      const brGrid = document.getElementById('battle-royale-grid');
      brGrid.innerHTML = Object.keys(weekObj?.battle_royale || {}).map(div => `
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
          <h3 class="font-bold text-amber-400 border-b border-slate-800 pb-1 mb-1.5">${div}</h3>
          <div class="space-y-1">
            ${weekObj.battle_royale[div].map((t, i) => `
              <div class="flex justify-between items-center py-0.5 ${i < 2 && isPlayed ? 'text-slate-200 font-medium' : 'text-slate-400'}">
                <span class="truncate mr-2">${i + 1}. ${t.name}</span>
                <div class="flex items-center justify-end space-x-1.5 shrink-0">
                  ${t.battle_vp ? '<span class="text-amber-400 font-bold text-[9px] mr-0.5">1 VP</span>' : ''}
                  <span class="font-mono text-right w-10">${isPlayed && t.score !== null ? t.score.toFixed(2) : '-'}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

      renderStandingsSnapshot(weekObj, w);
    }

    function renderStandingsSnapshot(weekObj, w) {
      if (!weekObj) return;

      const targetStandings = standingsMode === 'season' ? weekObj.season_standings : weekObj.quarter_standings;
      const qStandings = weekObj.quarter_standings || {};

      const upperTeams = qStandings["Upper Division"] || [];
      const upperRelegatedTeam = upperTeams.length > 0 
        ? upperTeams.reduce((min, t) => (t.pp < min.pp ? t : min)) 
        : null;

      const middleTeams = qStandings["Middle Division"] || [];
      const middlePromotedTeam = middleTeams[0] || null;
      
      let middleRelegatedTeam = null;
      if (middleTeams.length > 1) {
        const eligibleMiddle = middleTeams.slice(1);
        middleRelegatedTeam = eligibleMiddle.reduce((min, t) => (t.pp < min.pp ? t : min));
      }

      const lowerTeams = qStandings["Lower Division"] || [];
      const lowerPromotedTeam = lowerTeams[0] || null;

      const upperRelegatedId = upperRelegatedTeam?.id;
      const middleRelegatedId = middleRelegatedTeam?.id;

      // Render P&R summary ONLY if the quarter-end week has actually been played
      let summaryBannerHtml = '';
      if ((w === "4" || w === "8" || w === "12") && weekObj.played) {
        summaryBannerHtml = `
          <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 text-xs mb-3 space-y-2">
            <div class="flex justify-between items-center border-b border-amber-500/20 pb-1.5">
              <span class="font-bold text-amber-400 uppercase tracking-wider text-[11px]">Q${weekObj.quarter} Promotion & Relegation</span>
              <span class="text-[9px] bg-amber-500/20 text-amber-300 font-mono px-1.5 py-0.5 rounded">Quarter End</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[11px]">
              <div class="bg-slate-900/80 p-2 rounded border border-slate-800 space-y-1">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Upper / Middle Move</div>
                <div class="text-white font-medium flex items-center">
                  <span class="text-emerald-400 font-bold mr-1.5">⬆️</span> ${middlePromotedTeam?.name || 'N/A'} <span class="text-[9px] text-slate-400 ml-1">(to Upper)</span>
                </div>
                <div class="text-rose-400 font-medium flex items-center">
                  <span class="text-rose-400 font-bold mr-1.5">⬇️</span> ${upperRelegatedTeam?.name || 'N/A'} <span class="text-[9px] text-slate-400 ml-1">(to Middle)</span>
                </div>
              </div>
              <div class="bg-slate-900/80 p-2 rounded border border-slate-800 space-y-1">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Middle / Lower Move</div>
                <div class="text-white font-medium flex items-center">
                  <span class="text-emerald-400 font-bold mr-1.5">⬆️</span> ${lowerPromotedTeam?.name || 'N/A'} <span class="text-[9px] text-slate-400 ml-1">(to Middle)</span>
                </div>
                <div class="text-rose-400 font-medium flex items-center">
                  <span class="text-rose-400 font-bold mr-1.5">⬇️</span> ${middleRelegatedTeam?.name || 'N/A'} <span class="text-[9px] text-slate-400 ml-1">(to Lower)</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      const snapshotContainer = document.getElementById('standings-snapshot');

      snapshotContainer.innerHTML = summaryBannerHtml + Object.keys(targetStandings).map(div => `
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
          <h3 class="font-bold text-amber-400 border-b border-slate-800 pb-1 mb-1.5">${div}</h3>
          <div class="space-y-1">
            <div class="grid grid-cols-12 gap-1 text-[10px] text-slate-400 font-semibold uppercase border-b border-slate-800/40 pb-1">
              <span class="col-span-4">Team</span>
              <span class="col-span-2 text-center">VP</span>
              <span class="col-span-2 text-center">WLT</span>
              <span class="col-span-2 text-right">PF</span>
              <span class="col-span-2 text-right">PP</span>
            </div>
            ${targetStandings[div].map((t, idx) => {
              const isCurrentMode = standingsMode === 'current';
              const isPromoted = isCurrentMode && (div === "Middle Division" || div === "Lower Division") && idx === 0;
              const isRelegated = isCurrentMode && ((div === "Upper Division" && t.id === upperRelegatedId) || 
                                  (div === "Middle Division" && t.id === middleRelegatedId));

              let textStyle = "text-slate-400 font-normal";
              if (isPromoted) textStyle = "text-white font-semibold";
              else if (isRelegated) textStyle = "text-rose-400 font-semibold";

              return `
                <div class="grid grid-cols-12 gap-1 items-center py-0.5 ${textStyle}">
                  <span class="col-span-4 truncate">${idx + 1}. ${t.name}</span>
                  <span class="col-span-2 text-center font-mono font-bold ${isPromoted ? 'text-amber-400' : ''}">${t.vp}</span>
                  <span class="col-span-2 text-center font-mono text-[9px] text-slate-400">${t.wins}-${t.losses}-${t.ties}</span>
                  <span class="col-span-2 text-right font-mono text-[10px]">${t.pf.toFixed(2)}</span>
                  <span class="col-span-2 text-right font-mono text-[10px]">${t.pp.toFixed(2)}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderPostseasonView() {
      document.getElementById('regular-season-view').classList.add('hidden');
      document.getElementById('postseason-view').classList.remove('hidden');

      document.getElementById('quarter-label').innerText = 'Playoffs';
      document.getElementById('quarter-select').value = 'postseason';

      const weeksNavContainer = document.getElementById('weeks-list');
      weeksNavContainer.innerHTML = `<button class="w-full bg-amber-500 text-slate-950 font-bold py-1.5 px-2 rounded-lg text-center text-xs shadow">W13-17</button>`;

      const matrixData = leagueData.postseason_matrix || {};
      const container = document.getElementById('postseason-matrix-container');

      if (Object.keys(matrixData).length === 0) {
        container.innerHTML = `
          <div class="text-center text-slate-400 py-12 font-mono text-xs bg-slate-900 border border-slate-800 rounded-xl">
            🏆 Postseason tournament begins after Week 12.
          </div>`;
        return;
      }
    }

    loadData();
  </script>
</body>
</html>
