<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultimate Guillotine FFL - Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090a0f;
      --bg-card: #12151e;
      --bg-card-hover: #191e2b;
      --bg-bar-track: #1a202c;
      --bg-bar-prior: #475569; /* Slate 600 - Steel Gray */
      --bg-bar-done: #dc2626;  /* Solid Red - Finished Players */
      --border-color: #222938;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-red: #ef4444;
      --accent-gold: #f59e0b;
      --chopped-bg: rgba(220, 38, 38, 0.12);
      --chopped-border: #991b1b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 12px; }
    .container { max-width: 960px; margin: 0 auto; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 12px; border-bottom: 1px solid var(--border-color); margin-bottom: 12px; }
    .header-left { display: flex; flex-direction: column; }
    .logo-title { font-family: 'Cinzel', serif; font-size: 1.4rem; font-weight: 900; letter-spacing: 1px; color: #f1f5f9; text-transform: uppercase; text-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
    .mfl-link { font-size: 0.75rem; color: var(--accent-red); text-transform: uppercase; letter-spacing: 0.5px; text-decoration: none; font-weight: 600; transition: color 0.15s; }
    .mfl-link:hover { color: #f87171; text-decoration: underline; }
    
    .header-right { text-align: right; font-size: 0.85rem; font-weight: 700; color: #f1f5f9; display: flex; flex-direction: column; gap: 2px; }
    .metric-item { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
    .metric-label { color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .metric-val { color: #fff; font-weight: 800; }
    .metric-updated { color: var(--text-muted); font-size: 0.75rem; font-weight: 600; }
    
    /* Live Indicator */
    .live-indicator { display: inline-flex; align-items: center; gap: 5px; color: #ef4444; font-weight: 800; font-size: 0.8rem; background: rgba(239, 68, 68, 0.12); padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(239, 68, 68, 0.3); }
    .live-dot { width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444; animation: blink 1.2s infinite; }
    .week-indicator { display: inline-flex; align-items: center; gap: 5px; color: var(--text-muted); font-weight: 800; font-size: 0.8rem; background: #1e293b; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border-color); }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Controls Bar */
    .controls-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .week-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    
    select { background: #1e293b; color: #fff; border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 5px; font-size: 0.82rem; font-weight: 600; cursor: pointer; outline: none; }
    select:focus { border-color: var(--accent-red); }

    .week-btn { background: #1e293b; color: var(--text-muted); border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 5px; font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.15s; }
    .week-btn:hover { color: #fff; border-color: var(--accent-red); }
    .week-btn.active { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }
    
    .nav-links { display: flex; gap: 12px; }
    .nav-link { color: var(--text-muted); text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: color 0.15s; }
    .nav-link:hover, .nav-link.active { color: var(--accent-red); }

    /* Callout Banner */
    .callout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    @media (max-width: 500px) { .callout-grid { grid-template-columns: 1fr; } }
    .callout-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; }
    .callout-card.eliminated { border-left: 3px solid var(--accent-red); background: linear-gradient(135deg, rgba(220, 38, 38, 0.1) 0%, var(--bg-card) 100%); }
    .callout-card.winner { border-left: 3px solid var(--accent-gold); background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, var(--bg-card) 100%); }
    .callout-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 700; }
    .callout-value { font-size: 0.95rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Results Header & Legend */
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; font-weight: 700; }
    .legend { display: flex; gap: 12px; font-size: 0.73rem; font-weight: 600; color: var(--text-muted); flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-color { width: 10px; height: 10px; border-radius: 2px; }
    .color-prior { background-color: var(--bg-bar-prior); }
    .color-done { background-color: var(--bg-bar-done); }
    .color-live { 
      background: repeating-linear-gradient(
        -45deg,
        #881337,
        #881337 3px,
        #ef4444 3px,
        #ef4444 6px
      ); 
    }

    /* Column Headers above list */
    .list-col-headers { display: flex; justify-content: space-between; align-items: center; padding: 0 8px 4px; font-size: 0.68rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }

    /* Dense Team Row List */
    .team-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
    
    .team-row { display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 5px; padding: 4px 8px; gap: 6px; min-height: 34px; }
    .team-row.chopped { background: var(--chopped-bg); border-color: var(--chopped-border); }

    /* Left: Rank & Team Name */
    .team-meta { display: flex; align-items: center; gap: 6px; width: 155px; flex-shrink: 0; min-width: 0; }
    .team-rank { font-weight: 800; font-size: 0.78rem; color: var(--text-muted); width: 22px; text-align: right; flex-shrink: 0; }
    .team-name { font-size: 0.82rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .badge-chopped { background: #dc2626; color: #fff; font-size: 0.62rem; font-weight: 800; padding: 1px 4px; border-radius: 3px; text-transform: uppercase; flex-shrink: 0; }

    /* Middle: Bar Track */
    .bar-container { flex: 1; min-width: 0; display: flex; align-items: center; }
    .bar-track { background: var(--bg-bar-track); height: 20px; border-radius: 4px; width: 100%; display: flex; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); }
    
    .bar-seg { height: 100%; display: flex; align-items: center; font-size: 0.66rem; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: width 0.25s ease; }
    .bar-seg-prior { background-color: var(--bg-bar-prior); justify-content: flex-start; padding-left: 6px; }
    .bar-seg-done { background-color: var(--bg-bar-done); justify-content: flex-end; padding-right: 6px; }
    
    /* Slashed / Striped Red Bar for In-Game Scores */
    .bar-seg-live { 
      background: repeating-linear-gradient(
        -45deg,
        #881337,
        #881337 4px,
        #e11d48 4px,
        #e11d48 8px
      ); 
      justify-content: center; 
      padding: 0 4px;
      text-shadow: 0 0 3px rgba(0,0,0,0.9);
      border-left: 1px solid rgba(255,255,255,0.25);
    }

    /* Right: Total Score + Tight Player Status Columns */
    .row-right-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .team-score { width: 58px; text-align: right; font-weight: 800; font-size: 0.85rem; color: #fff; }

    /* Tight Status Columns (YTP, LIVE, DONE) */
    .status-cols { display: flex; gap: 3px; align-items: center; }
    .stat-badge { 
      width: 26px; 
      height: 20px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      border-radius: 3px; 
      font-size: 0.68rem; 
      font-weight: 800; 
    }
    
    .stat-ytp { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.25); }
    .stat-live { background: rgba(239, 68, 68, 0.25); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .stat-done { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }

    .cols-header-group { display: flex; gap: 3px; align-items: center; font-size: 0.65rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; }
    .hdr-badge { width: 26px; text-align: center; }

    @media (max-width: 600px) {
      .team-meta { width: 120px; }
      .team-name { font-size: 0.75rem; }
      .team-score { width: 48px; font-size: 0.78rem; }
      .stat-badge { width: 22px; font-size: 0.62rem; }
      .hdr-badge { width: 22px; }
      .bar-seg { font-size: 0.6rem; }
      .bar-seg-prior { padding-left: 3px; }
      .bar-seg-done { padding-right: 3px; }
      header { flex-direction: column; align-items: flex-start; gap: 6px; }
      .header-right { text-align: left; }
    }

    footer { text-align: center; font-size: 0.72rem; color: var(--text-muted); padding: 12px 0; border-top: 1px solid var(--border-color); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <div class="logo-title">Ultimate Guillotine</div>
        <a href="https://www42.myfantasyleague.com/2026/home/25918" target="_blank" rel="noopener noreferrer" class="mfl-link">MFL League Home ↗</a>
      </div>
      <div class="header-right">
        <div class="metric-item">
          <span class="metric-label">Status:</span>
          <div class="week-indicator" id="hdrStatus">Week 3</div>
        </div>
        <div class="metric-item">
          <span class="metric-label">Teams Remaining:</span>
          <span class="metric-val" id="hdrTeamsRemaining">22</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Updated:</span>
          <span class="metric-updated" id="hdrUpdated">--</span>
        </div>
      </div>
    </header>

    <div class="controls-bar">
      <div class="week-controls">
        <select id="weekDropdown">
          <option value="" disabled selected>Select Week...</option>
        </select>
        <button id="btnPrimaryWeek" class="week-btn active">Week 3</button>
        <button id="btnOtherWeek" class="week-btn">Week 4</button>
      </div>

      <div class="nav-links">
        <a href="index.html" class="nav-link active">Results</a>
        <a href="prizes.html" class="nav-link">Prizes</a>
        <a href="schedule.html" class="nav-link">Schedule</a>
      </div>
    </div>

    <div class="callout-grid">
      <div class="callout-card eliminated">
        <div class="callout-title" id="eliminatedTitle">Chopped This Week</div>
        <div class="callout-value" id="eliminatedText">Loading...</div>
      </div>

      <div class="callout-card winner">
        <div class="callout-title" id="winnerTitle">🏆 Weekly High Score</div>
        <div class="callout-value" id="winnerText">Loading...</div>
      </div>
    </div>

    <div class="section-header">
      <span id="resultsSectionTitle">Results</span>
      <div class="legend" id="legendContainer">
        <div class="legend-item"><div class="legend-color color-prior"></div> Prior Wk</div>
        <div class="legend-item"><div class="legend-color color-done"></div> Current Wk</div>
      </div>
    </div>

    <div class="list-col-headers">
      <div style="width: 155px;">Team</div>
      <div style="flex: 1; text-align: center;" id="barHeaderTitle">Rolling Score Breakdown</div>
      <div style="display: flex; gap: 6px; align-items: center;">
        <div style="width: 58px; text-align: right;">Total</div>
        <div class="cols-header-group" id="statusColHeaders" style="display: none;">
          <div class="hdr-badge" title="Yet to Play">YTP</div>
          <div class="hdr-badge" title="Currently Playing">LIVE</div>
          <div class="hdr-badge" title="Games Finished">DONE</div>
        </div>
      </div>
    </div>

    <div class="team-list" id="teamList"></div>

    <footer>
      MFL League 25918 • Scores update daily at 2:00 AM PT
    </footer>
  </div>

  <script>
    let leagueData = null;
    let selectedWeek = 1;
    // phase 'results': displayWeek is the last finished week; the other button previews the next week.
    // phase 'live':    displayWeek is the week in progress; the other button shows last week's results.
    let phase = 'results';
    let displayWeek = 1;
    let liveWeek = 1;
    let lastCompletedWeek = 0;

    async function init() {
      try {
        const res = await fetch('data.json', { cache: 'no-store' });
        if (res.ok) {
          leagueData = await res.json();
          liveWeek = leagueData.currentWeek || 1;
          if (leagueData.phase) {
            phase = leagueData.phase;
            displayWeek = leagueData.displayWeek || liveWeek;
            lastCompletedWeek = leagueData.lastCompletedWeek ?? (liveWeek - 1);
          } else {
            // Older data.json without phase fields.
            phase = leagueData.isLive ? 'live' : 'results';
            displayWeek = liveWeek;
            lastCompletedWeek = leagueData.isLive ? liveWeek - 1 : liveWeek;
          }
        }
      } catch (e) {
        console.warn('Using default fallback structure');
      }

      selectedWeek = displayWeek;
      setupControls();
      renderWeek(selectedWeek);
    }

    function formatUpdated(iso) {
      if (!iso) return '--';
      const d = new Date(iso);
      if (isNaN(d)) return '--';
      return d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
    }

    function setupControls() {
      const btnPrimary = document.getElementById('btnPrimaryWeek');
      const btnOther = document.getElementById('btnOtherWeek');
      const dropdown = document.getElementById('weekDropdown');
      const hdrStatusEl = document.getElementById('hdrStatus');

      document.getElementById('hdrUpdated').textContent = formatUpdated(leagueData && leagueData.lastUpdated);

      if (phase === 'live') {
        hdrStatusEl.className = 'live-indicator';
        hdrStatusEl.innerHTML = `<div class="live-dot"></div> LIVE - WEEK ${displayWeek}`;
      } else {
        hdrStatusEl.className = 'week-indicator';
        hdrStatusEl.textContent = `Week ${displayWeek} Final`;
      }

      // Results: [Week W Results] [Week W+1 →]. Live: [← Week W-1] [Week W Live]; the primary button stays on the right.
      const otherWeek = phase === 'live' ? displayWeek - 1 : displayWeek + 1;
      const showOther = otherWeek >= 1 && otherWeek <= 17;
      if (phase === 'live') {
        btnPrimary.textContent = `Week ${displayWeek} Live`;
        btnOther.textContent = `← Week ${otherWeek}`;
        btnPrimary.parentNode.insertBefore(btnOther, btnPrimary);
      } else {
        btnPrimary.textContent = `Week ${displayWeek} Results`;
        btnOther.textContent = `Week ${otherWeek} →`;
      }
      btnOther.style.display = showOther ? 'inline-block' : 'none';

      dropdown.innerHTML = '<option value="" disabled selected>Select Week...</option>';
      for (let w = 1; w <= 17; w++) {
        const opt = document.createElement('option');
        opt.value = w;
        opt.textContent = `Week ${w}`;
        dropdown.appendChild(opt);
      }

      btnPrimary.addEventListener('click', () => {
        selectedWeek = displayWeek;
        btnPrimary.classList.add('active');
        btnOther.classList.remove('active');
        dropdown.value = '';
        renderWeek(selectedWeek);
      });

      btnOther.addEventListener('click', () => {
        if (!showOther) return;
        selectedWeek = otherWeek;
        btnOther.classList.add('active');
        btnPrimary.classList.remove('active');
        dropdown.value = '';
        renderWeek(selectedWeek);
      });

      dropdown.addEventListener('change', (e) => {
        selectedWeek = parseInt(e.target.value);
        btnPrimary.classList.toggle('active', selectedWeek === displayWeek);
        btnOther.classList.toggle('active', showOther && selectedWeek === otherWeek);
        renderWeek(selectedWeek);
      });
    }

    // Cut count per RULES.md: 2 after Weeks 2-6, 1 after Weeks 7-16, none in Week 17.
    function getCutCount(week) {
      if (week >= 2 && week <= 6) return 2;
      if (week >= 7 && week <= 16) return 1;
      return 0;
    }

    // fid -> week cut. Recorded cuts come from data.json; MFL makes the cut itself once a week
    // is final, so a finished week with no recorded cut uses the lowest rolling score(s).
    function getCutWeeks() {
      const recorded = leagueData.eliminatedTeams || {};
      const singles = leagueData.weeklySingleScores || {};
      const cutWeek = {};
      Object.keys(recorded).forEach(fid => { cutWeek[fid] = recorded[fid].eliminatedWeek; });

      for (let w = 2; w <= lastCompletedWeek; w++) {
        const count = getCutCount(w);
        if (count === 0 || Object.values(cutWeek).includes(w)) continue;
        const rolling = fid => (singles[w - 1]?.[fid] || 0) + singles[w][fid];
        Object.keys(leagueData.franchises)
          .filter(fid => !(fid in cutWeek) && singles[w]?.[fid] !== undefined)
          .sort((a, b) => rolling(a) - rolling(b))
          .slice(0, count)
          .forEach(fid => { cutWeek[fid] = w; });
      }
      return cutWeek;
    }

    // Recorded winner, or for a finished week the highest single-week score among teams alive that week.
    function getWeeklyWinner(week, cutWeek) {
      const recorded = leagueData.weeklyWinners ? leagueData.weeklyWinners[week] : null;
      if (recorded) return { name: recorded.franchiseName, score: recorded.score };
      if (week > lastCompletedWeek || week >= 17) return null;
      const singles = leagueData.weeklySingleScores?.[week] || {};
      let best = null;
      Object.keys(singles).forEach(fid => {
        if (fid in cutWeek && cutWeek[fid] < week) return;
        if (!best || singles[fid] > best.score) best = { name: leagueData.franchises[fid]?.name || fid, score: singles[fid] };
      });
      return best;
    }

    function renderWeek(week) {
      if (!leagueData) return;

      const cutWeek = getCutWeeks();
      const weeklyWinner = getWeeklyWinner(week, cutWeek);
      const isLiveNow = (phase === 'live' && week === liveWeek);

      // Toggle Header Status Columns (YTP, LIVE, DONE)
      const statusColHeadersEl = document.getElementById('statusColHeaders');
      if (statusColHeadersEl) {
        statusColHeadersEl.style.display = isLiveNow ? 'flex' : 'none';
      }

      // Legend Container Update
      const legendEl = document.getElementById('legendContainer');
      if (isLiveNow) {
        legendEl.innerHTML = `
          <div class="legend-item"><div class="legend-color color-prior"></div> W${week-1} Total</div>
          <div class="legend-item"><div class="legend-color color-done"></div> W${week} Done</div>
          <div class="legend-item"><div class="legend-color color-live"></div> W${week} In-Game</div>
        `;
      } else {
        legendEl.innerHTML = `
          <div class="legend-item"><div class="legend-color color-prior"></div> Prior Wk</div>
          <div class="legend-item"><div class="legend-color color-done"></div> Current Wk</div>
        `;
      }

      const activeTeams = Object.keys(leagueData.franchises).filter(fid => {
        return !(fid in cutWeek) || cutWeek[fid] >= week;
      });

      document.getElementById('hdrTeamsRemaining').textContent = `${activeTeams.length}`;

      const choppedThisWeek = Object.keys(cutWeek)
        .filter(fid => cutWeek[fid] === week)
        .map(fid => leagueData.franchises[fid]?.name || fid);

      const elimEl = document.getElementById('eliminatedText');
      if (choppedThisWeek.length > 0) {
        elimEl.textContent = choppedThisWeek.join(', ');
      } else if (week === 1) {
        elimEl.textContent = 'None (Safe Week)';
      } else if (isLiveNow) {
        elimEl.textContent = 'In Progress';
      } else if (week >= 17) {
        elimEl.textContent = 'None (Final Week)';
      } else {
        elimEl.textContent = 'Upcoming / TBD';
      }

      const winnerEl = document.getElementById('winnerText');
      if (weeklyWinner) {
        winnerEl.textContent = `${weeklyWinner.name} (${weeklyWinner.score.toFixed(2)} pts)`;
      } else if (week >= 17) {
        winnerEl.textContent = 'No weekly prize (final week)';
      } else if (isLiveNow) {
        winnerEl.textContent = 'In Progress...';
      } else {
        winnerEl.textContent = 'Upcoming / TBD';
      }

      const teamListEl = document.getElementById('teamList');
      teamListEl.innerHTML = '';

      const priorWeekNum = week - 1;
      const currentWeekNum = week;

      const liveDetails = leagueData.liveDetails || {};

      const teamData = activeTeams.map(fid => {
        const singleScores = leagueData.weeklySingleScores || {};
        const priorScore = priorWeekNum >= 1 ? (singleScores[priorWeekNum]?.[fid] || 0) : 0;
        
        let doneScore = 0;
        let liveScore = 0;
        let ytp = 0;
        let inGame = 0;
        let finished = 0;

        if (isLiveNow && liveDetails[fid]) {
          doneScore = liveDetails[fid].doneScore || 0;
          liveScore = liveDetails[fid].liveScore || 0;
          ytp = liveDetails[fid].ytp || 0;
          inGame = liveDetails[fid].inGame || 0;
          finished = liveDetails[fid].finished || 0;
        } else {
          doneScore = singleScores[currentWeekNum]?.[fid] || 0;
        }

        const totalScore = priorScore + doneScore + liveScore;
        const isChoppedNow = cutWeek[fid] === week;

        return {
          id: fid,
          name: leagueData.franchises[fid].name,
          priorScore,
          doneScore,
          liveScore,
          totalScore,
          ytp,
          inGame,
          finished,
          isChoppedNow
        };
      });

      teamData.sort((a, b) => b.totalScore - a.totalScore);

      const maxScore = Math.max(...teamData.map(t => t.totalScore), 150);

      teamData.forEach((team, idx) => {
        const row = document.createElement('div');
        const choppedClass = team.isChoppedNow ? 'chopped' : '';
        row.className = 'team-row ' + (choppedClass ? ' ' + choppedClass : '');

        const priorPct = (team.priorScore / maxScore) * 100;
        const donePct = (team.doneScore / maxScore) * 100;
        const livePct = (team.liveScore / maxScore) * 100;

        const priorLabel = priorWeekNum >= 1 && team.priorScore > 0 ? 'W' + priorWeekNum + ' - ' + team.priorScore.toFixed(1) : '';
        const doneLabel = team.doneScore > 0 ? team.doneScore.toFixed(1) : '';
        const liveLabel = team.liveScore > 0 ? team.liveScore.toFixed(1) : '';

        const choppedBadge = team.isChoppedNow ? '<span class="badge-chopped">CUT</span>' : '';

        const priorBarHtml = priorPct > 0 ? '<div class="bar-seg bar-seg-prior" style="width: ' + priorPct + '%" title="Prior Wk: ' + team.priorScore.toFixed(2) + '">' + priorLabel + '</div>' : '';
        const doneBarHtml = donePct > 0 ? '<div class="bar-seg bar-seg-done" style="width: ' + donePct + '%" title="Current Done: ' + team.doneScore.toFixed(2) + '">' + doneLabel + '</div>' : '';
        const liveBarHtml = livePct > 0 ? '<div class="bar-seg bar-seg-live" style="width: ' + livePct + '%" title="In-Game Live: ' + team.liveScore.toFixed(2) + '">' + liveLabel + '</div>' : '';

        const statusColsHtml = isLiveNow ? `
            <div class="status-cols">
              <div class="stat-badge stat-ytp" title="Yet to Play: ${team.ytp} player(s)">${team.ytp}</div>
              <div class="stat-badge stat-live" title="Currently Playing: ${team.inGame} player(s)">${team.inGame}</div>
              <div class="stat-badge stat-done" title="Games Finished: ${team.finished} player(s)">${team.finished}</div>
            </div>` : '';

        row.innerHTML = `
          <div class="team-meta">
            <span class="team-rank">#${idx + 1}</span>
            <span class="team-name" title="${team.name}">${team.name}</span>
            ${choppedBadge}
          </div>

          <div class="bar-container">
            <div class="bar-track">
              ${priorBarHtml}
              ${doneBarHtml}
              ${liveBarHtml}
            </div>
          </div>

          <div class="row-right-group">
            <div class="team-score">${team.totalScore.toFixed(2)}</div>
            ${statusColsHtml}
          </div>
        `;

        teamListEl.appendChild(row);
      });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
