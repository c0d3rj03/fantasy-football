name: BaD Themed Matchups

# Become a Dynasty themed weeks (bad/themed_matchups.js):
#   10 "I've Earned This"   standings after Week 9: 1v10, 2v9, ... (Tuesday)
#   11 "Ten Kissing Sisters" best projected lineup: 1v2, 3v4, ... (Thursday 3pm ET)
#   12 "Wheat from the Chaff" standings after Week 11: 1v6, 2v7, ... (Tuesday)
# Standings weeks refuse to run until the previous week is final on MFL and the
# computed VP matches MFL's standings.
#
# mode:
#   preview  = print the Slack post and the detail behind it (no login, no writes).
#   inspect  = log in and print the WEEKSCHED form's fields (emails masked), change nothing.
#   dry-run  = preview, then log in and log the exact WEEKSCHED field changes, post nothing.
#   apply    = preview, then save the matchups on MFL and confirm them from the schedule export.
#              Refuses if MFL already has different matchups for the week, unless force is on.
#              With post_to_slack, posts the Slack text to the league's #general
#              (secret BAD_SLACK_WEBHOOK_URL) only after MFL confirms this run's save.
#   standings  = standings post after the week given (11-14): clinched / eliminated,
#              next week's scenarios, the Week 13/14 pick order, and after Week 14 the
#              playoff field (bad/standings_post.js). Posts to #general only with
#              post_to_slack. No MFL login, no MFL writes.
#   slack-test = post a one-line test message to #general, nothing else.
# Run names show mode, week and "+ Slack", so a posted run is easy to spot.
run-name: >-
  BaD ${{ github.event.inputs.mode || github.event.client_payload.mode || 'preview' }}
  week ${{ github.event.inputs.week || github.event.client_payload.week }}${{
  (github.event.inputs.post_to_slack == 'true' || github.event.client_payload.post_to_slack == 'true' || github.event.client_payload.post_to_slack == true) && ' + Slack' || '' }}
on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Week (matchup modes: the week to set; standings: the week just finished)'
        type: choice
        options: ['12', '13', '14', '11', '10']
        default: '12'
      mode:
        description: 'preview (Slack post + detail), inspect (form fields), dry-run, apply (save on MFL)'
        type: choice
        options: [preview, inspect, dry-run, apply, standings, slack-test]
        default: preview
      force:
        description: 'apply: replace matchups MFL already has for the week'
        type: boolean
        default: false
      post_to_slack:
        description: 'apply / standings: post to #general (apply: only once MFL confirms the save)'
        type: boolean
        default: false
  repository_dispatch:
    types: [bad-matchups-trigger]

concurrency:
  group: bad-mfl
  cancel-in-progress: false

jobs:
  matchups:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bad
    env:
      WEEK: ${{ github.event.inputs.week || github.event.client_payload.week }}
      MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'preview' }}
      SEASON_YEAR: '2026'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run
        env:
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          BAD_SLACK_WEBHOOK_URL: ${{ secrets.BAD_SLACK_WEBHOOK_URL }}
          FORCE: ${{ github.event.inputs.force || github.event.client_payload.force || 'false' }}
          POST_TO_SLACK: ${{ github.event.inputs.post_to_slack || github.event.client_payload.post_to_slack || 'false' }}
        run: |
          case "$MODE" in
            inspect)    node themed_matchups.js --week "$WEEK" --inspect ;;
            dry-run)    node themed_matchups.js --week "$WEEK" --dry-run ;;
            apply)      node themed_matchups.js --week "$WEEK" --apply \
                          $([ "$FORCE" = "true" ] && echo --force) \
                          $([ "$POST_TO_SLACK" = "true" ] && echo --post-slack) ;;
            standings)  node standings_post.js --after "$WEEK" \
                          $([ "$POST_TO_SLACK" = "true" ] && echo --post-slack) ;;
            slack-test) node themed_matchups.js --slack-test ;;
            *)          node themed_matchups.js --week "$WEEK" ;;
          esac
