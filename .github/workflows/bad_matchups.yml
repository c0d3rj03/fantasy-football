name: BaD Week 11 Projected Matchups

# Become a Dynasty, Week 11 "Ten Kissing Sisters": pairs teams by best projected
# lineup on MFL (1st vs 2nd, 3rd vs 4th, ...). Run it Thursday at 3pm ET.
#
# mode:
#   preview  = print the Slack post and every team's best lineup (no login, no writes).
#   inspect  = log in and print the WEEKSCHED form's fields (emails masked), change nothing.
#   dry-run  = preview, then log in and log the exact WEEKSCHED field changes, post nothing.
#   apply    = preview, then save the matchups on MFL and confirm them from the schedule export.
#              Refuses if MFL already has different matchups for the week, unless force is on.
on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Week'
        required: false
        default: '11'
      mode:
        description: 'preview (Slack post + lineups), inspect (form fields), dry-run, apply (save on MFL)'
        type: choice
        options: [preview, inspect, dry-run, apply]
        default: preview
      force:
        description: 'apply: replace matchups MFL already has for the week'
        type: boolean
        default: false
  repository_dispatch:
    types: [bad-matchups-trigger]

concurrency:
  group: bad-mfl
  cancel-in-progress: false

jobs:
  matchups:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bad
    env:
      WEEK: ${{ github.event.inputs.week || github.event.client_payload.week || '11' }}
      MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'preview' }}
      SEASON_YEAR: '2026'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run
        env:
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          FORCE: ${{ github.event.inputs.force || github.event.client_payload.force || 'false' }}
        run: |
          case "$MODE" in
            inspect) node kissing_sisters.js --week "$WEEK" --inspect ;;
            dry-run) node kissing_sisters.js --week "$WEEK" --dry-run ;;
            apply)   node kissing_sisters.js --week "$WEEK" --apply $([ "$FORCE" = "true" ] && echo --force) ;;
            *)       node kissing_sisters.js --week "$WEEK" ;;
          esac
