name: Ultimate Guillotine Live Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ultimate/**'

jobs:
  sync-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f "package.json" ]; then npm install; fi

      - name: Run MFL Scores Fetcher
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID || '25918' }}
          SEASON_YEAR: ${{ secrets.SEASON_YEAR || '2026' }}
        run: |
          node ultimate/mfl_scores_fetcher.js

      - name: Commit and Push Updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ultimate/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ultimate): automated score update [skip ci]" && git push)
