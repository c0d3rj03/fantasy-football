name: PBR Score Sync (daily and live)

# Started by the Google Apps Script triggers (pbr/apps_script_triggers.gs), or by hand from the Actions tab:
#   pbr-dailyscore-trigger: every day at about 2 AM Pacific (installPbrDailyScoreTrigger).
#   pbr-livescore-trigger:  every 10 minutes while an NFL game is in its window (installPbrLiveTrigger).
# Refetches MFL into pbr/data.json. While a week is in progress the dashboard shows its
# tentative scores, VP and standings (weekly_data[w].live); the week stays "played: false",
# so the VP push and the Gemmy recap still wait for the Tuesday end-of-week run.
# Read-only on MFL; no secrets needed. Commits only when the numbers changed.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [pbr-dailyscore-trigger, pbr-livescore-trigger]

# pbr_endweek.yml commits pbr/data.json too; never run them at the same time.
concurrency:
  group: pbr-data
  cancel-in-progress: false

jobs:
  sync-scores:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: pbr
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch MFL results and the week in progress (data.json)
        run: node mfl_scores_fetcher.js

      - name: Commit data.json
        env:
          KIND: ${{ github.event.action == 'pbr-livescore-trigger' && 'live' || 'daily' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(pbr): $KIND score sync [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
