name: Ultimate Guillotine End-of-Week Commissioner Actions

# Started externally by the Google Apps Script (no push/schedule triggers).
on:
  workflow_dispatch:
  repository_dispatch:
    types: [ultimate-endweek-trigger]

# Both Ultimate workflows commit ultimate/data.json; never run them at the same time.
concurrency:
  group: ultimate-data
  cancel-in-progress: false

jobs:
  run-commish-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f "package.json" ]; then npm install; fi

      - name: Run Commissioner Automation
        env:
          SEASON_YEAR: '2026'
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
        run: |
          cd ultimate
          node commish_automation.js

      - name: Commit and Push Updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ultimate/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ultimate): end of week commish automation [skip ci]" && git pull --rebase origin main && git push)

