name: PBR Daily Token Tracker

# Started every day by the Google Apps Script trigger (pbr/apps_script_triggers.gs, pbrTokensRun),
# or by hand from the Actions tab. Read-only on MFL; needs no secrets except the built-in token.
#   1. ktc_fetcher.js saves this month's KeepTradeCut values (ktc-values/KTC-YYYY-MM.json) if they
#      are not saved yet, so the first run of each month takes the new snapshot.
#   2. token_tracker.js rebuilds tokens_data.json (trades, $25+ waivers, promotions, adjustments)
#      and writes the balances and anything new to the run summary.
# Hand edits (voided trades, tokens traded in comments, starting balances) go in pbr/token_settings.json.
on:
  workflow_dispatch:
    inputs:
      refetch_ktc:
        description: "Refetch this month's KTC values even if they are already saved"
        type: boolean
        default: false
  repository_dispatch:
    types: [pbr-tokens-trigger]

concurrency:
  group: pbr-tokens
  cancel-in-progress: false

jobs:
  tokens:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: pbr
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. KTC monthly values
        id: ktc
        run: node ktc_fetcher.js ${{ github.event.inputs.refetch_ktc == 'true' && '--force' || '' }}

      # Runs even if KTC failed (trades then use the latest saved month, with a warning); the job still fails.
      - name: 2. Token ledger (tokens_data.json)
        if: ${{ !cancelled() }}
        run: node token_tracker.js

      - name: 3. Commit tokens_data.json and KTC values
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tokens_data.json ktc-values
          # token_tracker.js keeps last_updated when nothing else changed, so quiet days commit nothing.
          if git diff --staged --quiet; then
            echo "No token changes to commit."
          else
            git commit -m "chore(pbr): daily token ledger [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
