name: PBR Sync & Automation

on:
  repository_dispatch:
    types: [pbr-sync-trigger]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pbr-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run PBR Weekly Sync & Processing
        env:
          TZ: 'America/New_York'
          MFL_LEAGUE_ID: '63213'
          MFL_YEAR: '2026'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          cd pbr
          if [ -f package.json ]; then npm ci || npm install; fi
          node mfl_scores_fetcher.js || true
          node mfl_tx_fetcher.js || true

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pbr/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto(pbr): update weekly results, standings, and token ledger [skip ci]"
            git push origin main
          fi
