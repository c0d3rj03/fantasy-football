name: Update League Data

on:
  schedule:
    - cron: '0 06 * * 2'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and Calculate Weekly Results
        run: 
          cd pbr
          node fetcher.js
  
      - name: Sync Victory Points to MFL
        env:
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
        run: 
          cd pbr
          node mfl_updater.js

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weekly scores" && git push)

          - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
    
    