name: PBR Weekly Sync & Automation

on:
  schedule:
    # Runs every Tuesday at (5:23 AM EDT)
    - cron: '23 5 * * 2'
      timezone: 'America/New_York'

  workflow_dispatch:
    inputs:
      week:
        description: 'NFL Week Number'
        required: true

jobs:
  pbr-sync:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository with full git history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci || npm install

      # 4. FETCH WEEK RESULTS & CALCULATE VPS
      - name: Fetch Live MFL Results & Push VPs
        env:
          LEAGUE_ID: '63213'
          SEASON_YEAR: '2026'
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
        run: node pbr/fetcher.js
  
      # 5. GENERATE GEMMY'S AI RECAP
      - name: Generate Gemmy AI Post
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PBR_SLACK_BOT_TOKEN: ${{ secrets.SLACK_PBR_BOT_TOKEN }}
          PBR_SLACK_CHANNEL_GENERAL: ${{ secrets.PBR_SLACK_CHANNEL_GENERAL }}
          PBR_SLACK_CHANNEL_RANDOM: ${{ secrets.PBR_SLACK_CHANNEL_RANDOM }}
          PBR_SLACK_CHANNEL_TRADE_TALK: ${{ secrets.PBR_SLACK_CHANNEL_TRADE_TALK }}
          PBR_SLACK_CHANNEL_OFFICIALCOMMS: ${{ secrets.PBR_SLACK_CHANNEL_OFFICIALCOMMS }}
        run: node pbr/generate_post.js ${{ github.event.inputs.week || '2' }}

      # 6. Rebase remote changes to prevent push conflicts
      - name: Pull remote changes
        run: git pull --rebase origin main

      # 7. Commit and Push updated data.json and recaps to GitHub FIRST
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto(pbr): sync scores and recaps [skip ci]"
          
      # 8. POST RECAP TO SLACK
      - name: Post Recap to Slack
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node notify_slack.js pbr/gemmy_week_${{ github.event.inputs.week || '2' }}.md

