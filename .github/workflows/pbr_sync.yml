name: PBR Weekly Sync & Automation

on:
  schedule:
    # Runs every Tuesday at (5:23 AM EDT)
    - cron: '23 9 * * 2'

  workflow_dispatch:
    inputs:
      week:
        description: 'Week number (leave blank for auto-latest)'
        required: false
        default: ''

jobs:
  pbr-sync:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository with full git history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci || npm install

      # 4. FETCH WEEK RESULTS & CALCULATE VPS
      - name: Fetch Live MFL Results & Push VPs
        env:
          LEAGUE_ID: '63213'
          SEASON_YEAR: '2026'
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
        run: |
          node pbr/fetcher.js ${{ github.event.inputs.week }}
          node pbr/mfl_updater.js ${{ github.event.inputs.week }}
  
      # 5. GENERATE GEMMY'S AI RECAP
      - name: Generate Gemmy AI Post
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PBR_SLACK_BOT_TOKEN: ${{ secrets.SLACK_PBR_BOT_TOKEN }}
          PBR_SLACK_CHANNEL_GENERAL: ${{ secrets.PBR_SLACK_CHANNEL_GENERAL }}
          PBR_SLACK_CHANNEL_RANDOM: ${{ secrets.PBR_SLACK_CHANNEL_RANDOM }}
          PBR_SLACK_CHANNEL_TRADE_TALK: ${{ secrets.PBR_SLACK_CHANNEL_TRADE_TALK }}
          PBR_SLACK_CHANNEL_OFFICIALCOMMS: ${{ secrets.PBR_SLACK_CHANNEL_OFFICIALCOMMS }}
        run: node pbr/generate_post.js ${{ github.event.inputs.week }}

      # 6. Rebase remote changes to prevent push conflicts
      - name: Commit and Sync Remote Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "auto(pbr): sync scores and recaps [skip ci]"
          git pull --rebase origin main
          git push origin main
                
      # 7. POST RECAP TO SLACK
      - name: Post Recap to Slack
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          WEEK_VAL="${{ github.event.inputs.week }}"
          if [ -z "$WEEK_VAL" ]; then
            # Automatically find the most recently generated recap file
            RECAP_FILE=$(ls -t pbr/gemmy_week_*.md 2>/dev/null | head -n 1)
          else
            RECAP_FILE="pbr/gemmy_week_${WEEK_VAL}.md"
          fi

          if [ -n "$RECAP_FILE" ] && [ -f "$RECAP_FILE" ]; then
            echo "📢 Posting $RECAP_FILE to Slack..."
            node notify_slack.js "$RECAP_FILE"
          else
            echo "⚠️ No recap file found to post to Slack."
          fi

