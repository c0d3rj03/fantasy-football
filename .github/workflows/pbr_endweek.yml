name: PBR End-of-Week Commish Actions Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [pbr-endweek-trigger, ultimate-sync-trigger]

jobs:
  run-endweek-commish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pbr

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          elif [ -f ../package.json ]; then
            cd .. && npm install
          fi

      - name: 1. Calculate Standings & Victory Points
        env:
          MFL_LEAGUE_ID: '63213'
          MFL_YEAR: '2026'
        run: node mfl_scores_fetcher.js

      - name: 2. Push Victory Points & Adjustments to MFL
        env:
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          MFL_LEAGUE_ID: '63213'
          MFL_YEAR: '2026'
        run: node mfl_updater.js

      - name: 3. Generate and Post Gemmy Weekly Recap
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_PBR_BOT_TOKEN }}
          PBR_SLACK_CHANNEL_OFFICIALCOMMS: ${{ secrets.PBR_SLACK_CHANNEL_OFFICIALCOMMS }}
          PBR_SLACK_CHANNEL_GENERAL: ${{ secrets.PBR_SLACK_CHANNEL_GENERAL }}
          PBR_SLACK_CHANNEL_RANDOM: ${{ secrets.PBR_SLACK_CHANNEL_RANDOM }}
          PBR_SLACK_CHANNEL_TRADE_TALK: ${{ secrets.PBR_SLACK_CHANNEL_TRADE_TALK }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node generate_post.js

      - name: 4. Commit and Push Updated Data Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json recap.json tokens_data.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(auto): update PBR standings, VPs, and Gemmy recap [skip ci]"
            git push origin main
          fi
