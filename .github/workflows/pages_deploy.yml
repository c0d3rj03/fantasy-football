name: Deploy GitHub Pages

# Publishes the repo root (index.html, ultimate/, pbr/, ...) to GitHub Pages.
# Pages source must be "GitHub Actions" (Settings > Pages); set 2026-11-07. Unlike the old
# "Deploy from a branch" build, a custom workflow has no 10-builds-per-hour soft limit,
# which game-day live syncs from both leagues (~12 commits/hour) would exceed.
#
# Triggers:
#   push to main:  commits pushed by people (pushes made with GITHUB_TOKEN never start workflows).
#   workflow_run:  after any workflow that commits data (the bot's commits); deploys only if that
#                  run moved main, so a sync that found nothing new deploys nothing.
#   workflow_dispatch: by hand.
# Add any new workflow that pushes to main to the workflow_run list below. The names are glob
# patterns, so a name with * + ? ! [ ] in it never matches unless escaped with \ (avoid them).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Ultimate Guillotine Live Sync
      - Ultimate Guillotine End-of-Week Commissioner Actions
      - PBR Score Sync (daily and live)
      - PBR End-of-Week Results & Gemmy Recap
      - PBR Daily Token Tracker
      - PBR Tuesday Commish Automation
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer pending deploy replaces an older pending one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RAN_ON: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAIN=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$MAIN" = "$RAN_ON" ]; then
            echo "main is still at $RAN_ON: that run committed nothing. Skipping deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved $RAN_ON -> $MAIN. Deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Static files as-is (no Jekyll). .git and .github are left out of the artifact.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # GitHub's artifact list can lag just behind the upload, so deploy-pages may report
      # 'No artifacts named "github-pages"' for an upload that worked (run 43003710181,
      # 2026-11-11). Wait and try once more in the same job. Re-running a failed run does not
      # help: by then the first attempt's artifact is listed too, and deploy-pages refuses two.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
