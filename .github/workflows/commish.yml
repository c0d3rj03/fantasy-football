name: Ultimate Guillotine End-of-Week Commissioner Actions

on:
  workflow_dispatch:

jobs:
  run-commish-actions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Commissioner Automation
        env:
          LEAGUE_ID: '25918'
          SEASON_YEAR: '2026'
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
        run: |
          cd ultimate
          node commish-automation.js

      - name: Commit and Push Updated League State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ultimate/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: end-of-week commissioner eliminations & state update" && git push)
